name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # What the attestation step below needs: `id-token` to mint the OIDC token it
  # exchanges for a short-lived Sigstore signing certificate, and `attestations`
  # to persist the signed statement against this repository. It does not push to
  # a registry and creates no storage record, so `artifact-metadata` is not
  # among them.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The actions are pinned to commit SHAs rather than to the tags they move
    # with: this job holds a token that can write to the repository, and a tag
    # can be repointed at code nobody here has read. Dependabot raises the bumps.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install below runs the lifecycle scripts of every transitive
          # dependency; none of them needs the token checkout would otherwise
          # leave behind in the runner's git config. `gh` gets its own.
          persist-credentials: false

      # No version input: pnpm comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The safeguard: a tag that does not match the manifest never becomes a release.
      - name: Check the tag matches manifest.json
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # A signed statement that this workflow, at this commit, produced these
      # exact three files — so a reader can tell a release cut here from one
      # built somewhere else and attached by hand. It has to run before the
      # release is created: the assets are attested as they are built, and
      # `main.js` is what `pnpm verify` just built.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
